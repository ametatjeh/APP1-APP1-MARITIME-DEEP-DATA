# ==============================================================================
# Maritime Deep Data (App 1 Only) - Nginx Production Site Configuration
# Place in: /etc/nginx/sites-available/maritime-deep-data.conf
# Enable via: ln -s /etc/nginx/sites-available/maritime-deep-data.conf /etc/nginx/sites-enabled/
# ==============================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name mdd-investigations.ngo.internal;
    return 301 https://$host$request_uri;
}

# HTTPS Production Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mdd-investigations.ngo.internal;

    # SSL / TLS Hardening
    ssl_certificate /etc/ssl/certs/mdd-investigations.crt;
    ssl_certificate_key /etc/ssl/private/mdd-investigations.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Global Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Maximum payload size for document and evidence uploads (50 MB)
    client_max_body_size 50M;

    # Logging
    access_log /var/log/nginx/mdd_access.log combined;
    error_log /var/log/nginx/mdd_error.log warn;

    # Root for Frontend SPA Build
    root /var/www/maritime-deep-data/frontend/dist;
    index index.html;

    # 1. Frontend Vue 3 SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 2. Backend Laravel 13 REST API Routing (/api and /up)
    location ~ ^/(api|up) {
        root /var/www/maritime-deep-data/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.3-fpm-mdd.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/maritime-deep-data/backend/public/index.php;
            fastcgi_read_timeout 60;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }
    }

    # 3. Deny direct web access to sensitive directories and dotfiles
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 4. Strict isolation: NEVER allow direct HTTP access to private evidence storage
    location ^~ /storage/app/private_evidence {
        deny all;
        return 403;
    }

    location ^~ /storage/backups {
        deny all;
        return 403;
    }
}
