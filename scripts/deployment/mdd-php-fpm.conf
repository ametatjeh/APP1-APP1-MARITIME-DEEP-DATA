; ==============================================================================
; Maritime Deep Data (App 1 Only) - Dedicated PHP-FPM Pool Configuration
; Place in: /etc/php/8.3/fpm/pool.d/mdd.conf
; ==============================================================================

[mdd]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm-mdd.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 1000

; Memory limit and timeouts
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 60
php_admin_value[upload_max_filesize] = 50M
php_admin_value[post_max_size] = 55M

; Security Hardening: Disable dangerous execution functions in production
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source

; Restrict open_basedir to application directories
php_admin_value[open_basedir] = /var/www/maritime-deep-data/backend:/tmp:/var/log/nginx

; Error logging
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-fpm/mdd_error.log
